# Deploys the static Khidmat site to GitHub Pages by pushing the site
# files to a dedicated `gh-pages` branch. GitHub Pages then serves that
# branch as the public site.
#
# Why this approach instead of actions/deploy-pages?
# The repo's `github-pages` environment was configured (via the GitHub
# UI's "configure" templates) with a custom branch policy that has no
# branches in its allow list. Every actions/deploy-pages run was being
# rejected at the environment gate before any step could execute. The
# branch-deploy approach avoids that environment entirely.
#
# Prerequisite (one-time, manual): in the repository's
#   Settings -> Pages -> Build and deployment -> Source
# select "Deploy from a branch", then choose:
#   Branch: gh-pages
#   Folder: / (root)
# and click Save. The first successful run of this workflow will create
# the `gh-pages` branch automatically.
name: Deploy to GitHub Pages

on:
  # Auto-deploy whenever main moves.
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

# peaceiris/actions-gh-pages needs write access to push the gh-pages
# branch. No `pages:` or `id-token:` permissions are needed because we
# are not using the github-pages environment.
permissions:
  contents: write

# Don't pile up parallel deploys against the same branch.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files for publishing
        # Copy only the runtime assets into a clean folder so that
        # README, LICENSE, .github/, and the workflow file itself are
        # not pushed onto the gh-pages branch.
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest _site/
          # LICENSE is fine to publish too, but keep the gh-pages branch
          # focused on what the browser actually loads.
          ls -la _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # Replace the gh-pages branch contents on every deploy so old
          # files don't linger.
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }} to gh-pages"
